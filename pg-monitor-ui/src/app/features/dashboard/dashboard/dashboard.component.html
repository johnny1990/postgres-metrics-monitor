<div class="container mt-4">

  <h2 class="mb-4">PgMonitor Dashboard</h2>

  <div class="row mb-4">

    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5>CPU Usage</h5>

          <h2>
            {{ latestMetric?.cpuUsage }}%
          </h2>
        </div>
      </div>
    </div>

    <div class="col-md-6">
      <div class="card shadow-sm">
        <div class="card-body">
          <h5>Memory Usage</h5>

          <h2>
            {{ latestMetric?.memoryUsage }} MB
          </h2>
        </div>
      </div>
    </div>

  </div>

  <div class="card shadow-sm">
    <div class="card-body">

      <h5 class="mb-3">Metrics History</h5>

      <table class="table table-striped">
        <thead>
          <tr>
            <th>Date</th>
            <th>CPU %</th>
            <th>Memory MB</th>
          </tr>
        </thead>

        <tbody>
          <tr *ngFor="let item of history">
            <td>{{ item.createdAt | date:'medium' }}</td>
            <td>{{ item.cpuUsage }}</td>
            <td>{{ item.memoryUsage }}</td>
          </tr>
        </tbody>

      </table>

    </div>
  </div>

</div>
